name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.94.1"
  CARGO_AUDIT_VERSION: "0.22.2"

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tauri
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: tauri/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build production frontend
        run: npm run build
      - name: Audit npm dependencies
        run: npm audit

  rust-quality:
    name: Rust quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tauri/src-tauri
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends
          build-essential curl file libayatana-appindicator3-dev librsvg2-dev
          libssl-dev libwebkit2gtk-4.1-dev libxdo-dev pkg-config wget
      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
          --component rustfmt --component clippy
      - name: Select pinned Rust toolchain
        run: rustup default ${{ env.RUST_TOOLCHAIN }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Rust tests
        run: cargo test --all-features --locked
      - name: Run strict Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Install cargo-audit
        run: cargo install cargo-audit --version ${{ env.CARGO_AUDIT_VERSION }} --locked
      - name: Audit Rust dependencies
        run: cargo audit

  windows:
    name: Windows compile and test
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tauri/src-tauri
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
      - name: Select pinned Rust toolchain
        run: rustup default ${{ env.RUST_TOOLCHAIN }}
      - name: Compile and test Windows backend
        run: cargo test --all-features --locked

  android:
    name: Android lint and debug compile
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tauri/src-tauri/gen/android
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;27.2.12479018
      - name: Validate and set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true
          add-job-summary: never
          validate-wrappers: true
      - name: Install pinned Rust Android targets
        run: >-
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
          --target aarch64-linux-android
      - name: Select pinned Rust toolchain
        run: rustup default ${{ env.RUST_TOOLCHAIN }}
      - name: Select Android NDK
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Check Android Rust and generate Tauri build inputs
        working-directory: tauri/src-tauri
        env:
          TAURI_ANDROID_PROJECT_PATH: ${{ github.workspace }}/tauri/src-tauri/gen/android
          TAURI_ANDROID_PACKAGE_UNESCAPED: com.why.ntfy_notifier
          WRY_ANDROID_PACKAGE: com.why.ntfy_notifier
          WRY_ANDROID_LIBRARY: ntfy_notifier_lib
          WRY_ANDROID_KOTLIN_FILES_OUT_DIR: ${{ github.workspace }}/tauri/src-tauri/gen/android/app/src/main/java/com/why/ntfy_notifier/generated
        run: |
          mkdir -p "$WRY_ANDROID_KOTLIN_FILES_OUT_DIR"
          ndk_bin="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$ndk_bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$ndk_bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ndk_bin/aarch64-linux-android24-clang"
          cargo check --target aarch64-linux-android --no-default-features --locked
      - name: Run Android lint and debug compile
        run: >-
          ./gradlew --no-daemon --stacktrace lintUniversalDebug
          compileUniversalDebugKotlin testUniversalDebugUnitTest
      - name: Verify generation did not alter tracked source
        working-directory: .
        run: git diff --exit-code
