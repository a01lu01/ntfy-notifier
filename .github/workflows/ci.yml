name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.94.1"
  CARGO_AUDIT_VERSION: "0.22.2"

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tauri
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: tauri/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build production frontend
        run: npm run build
      - name: Audit npm dependencies
        run: npm audit

  rust-quality:
    name: Rust quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tauri/src-tauri
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends
          build-essential curl file libayatana-appindicator3-dev librsvg2-dev
          libssl-dev libwebkit2gtk-4.1-dev libxdo-dev pkg-config wget
      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
          --component rustfmt --component clippy
      - name: Select pinned Rust toolchain
        run: rustup default ${{ env.RUST_TOOLCHAIN }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Rust tests
        run: cargo test --all-features --locked
      - name: Run strict Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Install cargo-audit
        run: cargo install cargo-audit --version ${{ env.CARGO_AUDIT_VERSION }} --locked
      - name: Audit Rust dependencies
        run: cargo audit

  windows:
    name: Windows compile and test
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tauri/src-tauri
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
          --component clippy
      - name: Select pinned Rust toolchain
        run: rustup default ${{ env.RUST_TOOLCHAIN }}
      - name: Compile and test Windows backend
        run: cargo test --all-features --locked
      - name: Run strict Windows Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  android:
    name: Android lint, debug compile and API 24 tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tauri/src-tauri/gen/android
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: >-
            platform-tools
            emulator
            platforms;android-36
            build-tools;36.0.0
            ndk;27.2.12479018
            system-images;android-24;google_apis;x86_64
      - name: Validate and set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true
          add-job-summary: never
          validate-wrappers: true
      - name: Install pinned Rust Android targets
        run: >-
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
          --target aarch64-linux-android --target x86_64-linux-android
      - name: Select pinned Rust toolchain
        run: rustup default ${{ env.RUST_TOOLCHAIN }}
      - name: Select Android NDK
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Check Android Rust and generate Tauri build inputs
        working-directory: tauri/src-tauri
        env:
          TAURI_ANDROID_PROJECT_PATH: ${{ github.workspace }}/tauri/src-tauri/gen/android
          TAURI_ANDROID_PACKAGE_UNESCAPED: com.why.ntfy_notifier
          WRY_ANDROID_PACKAGE: com.why.ntfy_notifier
          WRY_ANDROID_LIBRARY: ntfy_notifier_lib
          WRY_ANDROID_KOTLIN_FILES_OUT_DIR: ${{ github.workspace }}/tauri/src-tauri/gen/android/app/src/main/java/com/why/ntfy_notifier/generated
        run: |
          mkdir -p "$WRY_ANDROID_KOTLIN_FILES_OUT_DIR"
          ndk_bin="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$ndk_bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$ndk_bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ndk_bin/aarch64-linux-android24-clang"
          cargo check --target aarch64-linux-android --no-default-features --locked
      - name: Build and verify the API 24 subscriber JNI library
        working-directory: tauri/src-tauri
        env:
          TAURI_ANDROID_PROJECT_PATH: ${{ github.workspace }}/tauri/src-tauri/gen/android
          TAURI_ANDROID_PACKAGE_UNESCAPED: com.why.ntfy_notifier
          WRY_ANDROID_PACKAGE: com.why.ntfy_notifier
          WRY_ANDROID_LIBRARY: ntfy_notifier_lib
          WRY_ANDROID_KOTLIN_FILES_OUT_DIR: ${{ github.workspace }}/tauri/src-tauri/gen/android/app/src/main/java/com/why/ntfy_notifier/generated
        run: |
          ndk_bin="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_x86_64_linux_android="$ndk_bin/x86_64-linux-android24-clang"
          export AR_x86_64_linux_android="$ndk_bin/llvm-ar"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$ndk_bin/x86_64-linux-android24-clang"
          cargo build --target x86_64-linux-android --no-default-features --locked
          jni_dir="${{ github.workspace }}/tauri/src-tauri/gen/android/app/src/main/jniLibs/x86_64"
          mkdir -p "$jni_dir"
          cp target/x86_64-linux-android/debug/libntfy_notifier_lib.so "$jni_dir/"
          "$ndk_bin/llvm-nm" -D --defined-only "$jni_dir/libntfy_notifier_lib.so" \
            | grep -F "Java_app_ntfy_notifier_NativeSubscriber_nativeStart"
          "$ndk_bin/llvm-nm" -D --defined-only "$jni_dir/libntfy_notifier_lib.so" \
            | grep -F "Java_app_ntfy_notifier_NativeSubscriber_nativeReconfigure"
          "$ndk_bin/llvm-nm" -D --defined-only "$jni_dir/libntfy_notifier_lib.so" \
            | grep -F "Java_app_ntfy_notifier_NativeSubscriber_nativeStop"
      - name: Run Android lint and debug compile
        run: >-
          ./gradlew --no-daemon --stacktrace lintUniversalDebug
          compileUniversalDebugKotlin compileUniversalDebugAndroidTestKotlin
          testUniversalDebugUnitTest
      - name: Start API 24 emulator
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force --name ntfy-api24 \
            --path "$ANDROID_AVD_HOME/ntfy-api24.avd" \
            --package "system-images;android-24;google_apis;x86_64" \
            --device pixel <<< "no"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx ntfy-api24
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd ntfy-api24 -no-window -noaudio -no-boot-anim \
            -no-snapshot -wipe-data -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/android-emulator.log" 2>&1 &
          timeout 300 adb wait-for-device
          boot_deadline=$((SECONDS + 300))
          until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do
            if (( SECONDS >= boot_deadline )); then
              tail -200 "$RUNNER_TEMP/android-emulator.log"
              exit 1
            fi
            sleep 2
          done
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell input keyevent 82
      - name: Run API 24 Android instrumentation tests
        run: >-
          ./gradlew --no-daemon --stacktrace connectedUniversalDebugAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.ntfySubscriberIntegration=true
          -Pandroid.testInstrumentationRunnerArguments.notClass=app.ntfy.notifier.SubscriberBootRecoveryInstrumentationTest#enabledBootPersistsAndRepeatedBootReconfigureAndActivityDoNotDuplicateSse
          -x rustBuildUniversalDebug -x rustBuildArm64Debug -x rustBuildArmDebug
          -x rustBuildX86Debug -x rustBuildX86_64Debug
      - name: Run isolated API 24 Tauri lifecycle test
        run: >-
          ./gradlew --no-daemon --stacktrace connectedUniversalDebugAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.ntfySubscriberIntegration=true
          -Pandroid.testInstrumentationRunnerArguments.preserveTauriActivity=true
          -Pandroid.testInstrumentationRunnerArguments.class=app.ntfy.notifier.SubscriberBootRecoveryInstrumentationTest#enabledBootPersistsAndRepeatedBootReconfigureAndActivityDoNotDuplicateSse
          -x rustBuildUniversalDebug -x rustBuildArm64Debug -x rustBuildArmDebug
          -x rustBuildX86Debug -x rustBuildX86_64Debug
      - name: Show emulator diagnostics after failure
        if: failure()
        run: tail -200 "$RUNNER_TEMP/android-emulator.log" || true
      - name: Verify generation did not alter tracked source
        working-directory: .
        run: git diff --exit-code
