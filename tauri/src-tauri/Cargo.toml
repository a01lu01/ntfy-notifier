[package]
name = "ntfy-notifier"
version = "1.0.0"
description = "Windows tray tool for ntfy push notifications"
edition = "2021"

[lib]
name = "ntfy_notifier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
base64 = "0.22"
regex = "1"
arboard = "3"
winreg = "0.55"
dirs = "6"
winrt-notification = "0.5"
winapi = { version = "0.3", features = ["dpapi", "wincrypt", "winuser", "winbase", "ntdef", "basetsd"] }
