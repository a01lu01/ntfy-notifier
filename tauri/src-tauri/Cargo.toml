[package]
name = "ntfy-notifier"
version = "1.1.9"
description = "Cross-platform ntfy push notifier (Windows tray / Android)"
edition = "2021"

[lib]
name = "ntfy_notifier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["desktop"]
desktop = ["tauri/tray-icon", "tauri/image-ico", "dep:tauri-plugin-single-instance"]

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
base64 = "0.22"
regex = "1"
dirs = "6"

[target.'cfg(target_os = "windows")'.dependencies]
arboard = "3"
winreg = "0.55"
winrt-notification = "0.5"
winapi = { version = "0.3", features = ["dpapi", "wincrypt", "winuser", "winbase", "ntdef", "basetsd"] }
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
tempfile = "3"
